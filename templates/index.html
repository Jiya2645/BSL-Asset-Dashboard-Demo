<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSL Asset Management Portal</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="logo">

        <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        class="logo-img"
        alt="Logo">

        <h2>Employee Portal</h2>

        <p>Digital Employee Service System</p>

    </div>

    {% if error %}
    <p id="message">{{ error }}</p>
    {% endif %}

    <form action="/login" method="POST">

        <input
        type="text"
        name="employee_id"
        placeholder="Employee ID"
        required>

        <input
        type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            SIGN IN
        </button>

    </form>

</div>

</body>
</html>
